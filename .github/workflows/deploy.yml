name: Deploy EC2 via ECR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 553267201437.dkr.ecr.us-east-1.amazonaws.com

      - name: Build da imagem
        run: |
          docker build -t busca:latest .

      - name: Tag da imagem
        run: |
          docker tag busca:latest 553267201437.dkr.ecr.us-east-1.amazonaws.com/busca:latest

      - name: Push para o ECR
        run: |
          docker push 553267201437.dkr.ecr.us-east-1.amazonaws.com/busca:latest

      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 553267201437.dkr.ecr.us-east-1.amazonaws.com

            docker stop app-busca || true

            docker rm app-busca || true

            docker pull 553267201437.dkr.ecr.us-east-1.amazonaws.com/busca:latest

            docker run -d \
              --name app-busca \
              -p 5000:5000 \
              553267201437.dkr.ecr.us-east-1.amazonaws.com/busca:latest