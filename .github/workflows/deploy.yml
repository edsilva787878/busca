name: Deploy to VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd /home/${{ secrets.VM_USER }}/app
          git pull
          docker build -t busca-cep-app .
          docker stop busca-cep-app || true
          docker rm busca-cep-app || true
          docker run -d --name busca-cep-app -p 5000:5000 busca-cep-app